<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Mohit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: #06070f;
        color: #e8eaf4;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .wrap {
        max-width: 480px;
      }
      .code {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        background: linear-gradient(100deg, #a78bff, #22d3ee, #34d399);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        font-size: 22px;
        margin: 16px 0 8px;
        letter-spacing: -0.01em;
      }
      p {
        color: #9aa1b8;
        font-size: 15px;
        line-height: 1.6;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 26px;
        padding: 12px 22px;
        border-radius: 999px;
        background: linear-gradient(to right, #9d7bff, #22d3ee, #34d399);
        color: #0b1220;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        transition: transform 0.2s ease;
      }
      a.btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>This page took a wrong turn.</h1>
      <p>The page you’re after doesn’t exist — but the good stuff is one click away.</p>
      <a class="btn" href="/">← Back to portfolio</a>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#06070f" />
    <!-- Set theme + browser chrome colour before paint to avoid a flash (dark-first; honours saved choice) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'light' ? '#f5f6fb' : '#06070f')
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--

      some social crawlers require an absolute image URL):

        <meta property="og:url" content="https://YOUR-DOMAIN/" />
      and change og:image / twitter:image below to https://YOUR-DOMAIN/og-image.png
    -->

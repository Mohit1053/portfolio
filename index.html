<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06070f" />

    <!--
      AFTER you pick a domain on Vercel, add these inside <head> (absolute URLs —
      some social crawlers require an absolute image URL):
        <link rel="canonical" href="https://YOUR-DOMAIN/" />
        <meta property="og:url" content="https://YOUR-DOMAIN/" />
      and change og:image / twitter:image below to https://YOUR-DOMAIN/og-image.png
    -->

    <title>Mohit — AI Product Manager, Engineer & Founder</title>
    <meta
      name="description"
      content="Mohit builds and ships production AI products end-to-end — voice AI, personalisation, quant intelligence and automation. Technical Product Manager at Times Internet and founder of R2C. One-stop partner across Product, Engineering and Data."
    />
    <meta name="author" content="Mohit" />
    <meta
      name="keywords"
      content="AI Product Manager, Technical Product Manager, AI Engineer, Machine Learning, LLM, RAG, Voice AI, Quant, Freelance AI, AI Agency, Mohit"
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohit" />
    <meta property="og:title" content="Mohit — AI Product Manager, Engineer & Founder" />
    <meta
      property="og:description"
      content="One-stop AI partner across Product, Engineering and Data. Shipping production AI at India scale."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mohit — AI Product Manager, Engineer & Founder" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohit — AI Product Manager, Engineer & Founder" />
    <meta
      name="twitter:description"
      content="One-stop AI partner across Product, Engineering and Data. Shipping production AI at India scale."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
